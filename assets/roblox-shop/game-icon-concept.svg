<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Galactic Animal Worlds game icon concept</title>
  <desc id="desc">A square Roblox game icon concept with a player, galactic skateboard, dinosaur, bird, fruit, and portal.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#243bff"/>
      <stop offset="45%" stop-color="#15113d"/>
      <stop offset="100%" stop-color="#050512"/>
    </radialGradient>
    <linearGradient id="portal" x1="0" x2="1">
      <stop offset="0%" stop-color="#21f5ff"/>
      <stop offset="48%" stop-color="#ff45f6"/>
      <stop offset="100%" stop-color="#fff05a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

